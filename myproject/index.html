<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SpookySketch</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <button id="menuBtn">☰</button>

    <div class="app">

        <header>

            <h1 id="title">SpookySketch</h1>

            <p id="subtitle">Draw. Doodle. Discover.</p>

        </header>

        <div class="studio">
            <div class="toolbar">

                <button id="pencilBtn">
                    Pencil
                </button>

                <button id="brushBtn">
                    Brush
                </button>

                <label for="brushSize">
                    Line Size
                </label>

                <input
                    type="range"
                    id="brushSize"
                    min="1"
                    max="30"
                    value="4"
                >

                <button id="eraserBtn">
                    Eraser
                </button>

                <input
                    type="color"
                    id="colorPicker"
                    value="#ff6b6b"
                >

                <button id="undoBtn">
                    Undo
                </button>

                <button id="clearBtn">
                    Clear
                </button>

                <button id="redoBtn">
                    Redo
                </button>

                <button id="saveBtn">
                    Save
                </button>

                <button id="darkBtn">
                    Dark Mode
                </button>

            </div>

            <div class="canvas-box">
                <canvas
                    id="characterCanvas"
                    width="600"
                    height="600">
                </canvas>
                <canvas
                    id="artCanvas"
                    width="600"
                    height="600">
                </canvas>
            <div id="jumpscareOverlay">
                <video 
                    id="jumpscareVideo"
                    preload="auto"
                    playsinline
            >
            <source src="jumpscare.mp4" type="video/mp4">
        </video>
            </div>

                <div id="batLayer"></div>

                <div id="referenceContainer">
                    <div id="referenceTitle">FILL 50%</div>
                <div id="spookyMessage">THE SKETCH IS WATCHING!</div>

                    <canvas
                        id="referenceCanvas"
                        width="160"
                        height="160">
                    </canvas>

                    <div id="similarityContainer">
                        <span id="similarityValue">MATCH: 0%</span>
                    </div>
                </div>

            </div>


        </div>

    </div>


    <script src="script.js" defer></script>

</body>
</html>

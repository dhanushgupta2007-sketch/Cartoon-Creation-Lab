<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
content="width=device-width, initial-scale=1.0">
<title>Cartoon Creation Lab</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app">

    <header>
        <h1>Cartoon Creation Lab</h1>
        <p>Create, color and decorate your own cartoon person!</p>
    </header>
     
    <div class="studio">

        <div class="toolbar">

            <button id = "pencilBtn">Pencil</button>
            <button id="brushBtn"> Brush</button>
            <label for="brushSize">Line Size</label>
            <input type="range" id="brushSize" min="1" max="30" value="4">
            <button id="eraserBtn"> Eraser</button>
            <input type="color" id="colorPicker" value="#ff6b6b">
            <button id="undoBtn"> Undo</button>
            <button id="clearBtn"> Clear</button>
            <button id="redoBtn"> Redo</button>
            <button id="saveBtn">Save </button>

        </div>

        <div class="canvas-box">
            <canvas id="characterCanvas" width="600" height="600"></canvas>
            <canvas id="artCanvas" width = "600" height="600"></canvas>
        </div>

    </div>

</div>

<script src="script.js" defer></script>
</body>
</html>
